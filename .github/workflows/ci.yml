name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04 gcc
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            cmake_version: ""
            enable_sanitizers: OFF
            verify_installed_package: true
            require_pkg_config: true
            lsan_options: ""
          - name: ubuntu-24.04 clang+sanitizers
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cmake_version: ""
            enable_sanitizers: ON
            verify_installed_package: false
            require_pkg_config: false
            lsan_options: detect_leaks=0
          - name: ubuntu-22.04 gcc
            os: ubuntu-22.04
            cc: gcc
            cxx: g++
            cmake_version: "3.20.6"
            enable_sanitizers: OFF
            verify_installed_package: true
            require_pkg_config: true
            lsan_options: ""
          - name: macos-15 apple-clang
            os: macos-15
            cc: clang
            cxx: clang++
            cmake_version: ""
            enable_sanitizers: OFF
            verify_installed_package: true
            require_pkg_config: false
            lsan_options: ""
          - name: macos-14 apple-clang
            os: macos-14
            cc: clang
            cxx: clang++
            cmake_version: ""
            enable_sanitizers: OFF
            verify_installed_package: true
            require_pkg_config: false
            lsan_options: ""

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LSAN_OPTIONS: ${{ matrix.lsan_options }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up minimum supported CMake
        if: matrix.cmake_version != ''
        env:
          CMAKE_VERSION: ${{ matrix.cmake_version }}
          CMAKE_SHA256: 458777097903b0f35a0452266b923f0a2f5b62fe331e636e2dcc4b636b768e36
        run: |
          archive="${RUNNER_TEMP}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          install_dir="${RUNNER_TEMP}/cmake-${CMAKE_VERSION}-linux-x86_64"
          curl --fail --show-error --location --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" \
            --output "${archive}"
          echo "${CMAKE_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      - name: Show CMake version
        run: cmake --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DNET_FETCH=ON
          -DBUILD_TESTING=ON
          -DENABLE_SANITIZERS=${{ matrix.enable_sanitizers }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        # Sanitizer builds are diagnostic artifacts, not supported packages.
        if: matrix.verify_installed_package
        run: cmake --install build --prefix "${{ github.workspace }}/stage"

      - name: Verify installed manual page
        if: matrix.verify_installed_package
        run: |
          cmake \
            -DINSTALL_PREFIX="${{ github.workspace }}/stage" \
            -DINSTALL_MANIFEST="${{ github.workspace }}/build/install_manifest.txt" \
            -P tests/cmake/VerifyInstalledManual.cmake

      - name: Verify installed package with CMake example
        if: matrix.verify_installed_package
        run: |
          cmake -S examples/cmake -B build/package-example \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage"
          cmake --build build/package-example --parallel
          ctest --test-dir build/package-example --output-on-failure

      - name: Verify installed pkg-config package
        if: matrix.verify_installed_package
        run: |
          cmake \
            -DINSTALL_PREFIX="${{ github.workspace }}/stage" \
            -DINSTALL_MANIFEST="${{ github.workspace }}/build/install_manifest.txt" \
            -DPACKAGE_EXPECTATIONS="${{ github.workspace }}/build/tests/pkg_config/PackageExpectations.cmake" \
            -DSOURCE_FILE="${{ github.workspace }}/tests/cases/pipeline/smoke/01_hello/hello.f" \
            -DEXPECTED_STDOUT_FILE="${{ github.workspace }}/tests/cases/pipeline/smoke/01_hello/expected.txt" \
            -DC_COMPILER="${{ matrix.cc }}" \
            -DSOURCE_ROOT="${{ github.workspace }}" \
            -DBUILD_ROOT="${{ github.workspace }}/build" \
            -DTEST_ROOT="${{ github.workspace }}/build/pkg-config-consumer" \
            -DREQUIRE_PKG_CONFIG=${{ matrix.require_pkg_config }} \
            -P tests/pkg_config/VerifyInstalledPkgConfig.cmake

      - name: Verify Fortran changes trigger regeneration
        if: matrix.verify_installed_package
        run: |
          cmake \
            -DEXAMPLE_SOURCE_DIR="${{ github.workspace }}/examples/cmake" \
            -DF2C_PREFIX="${{ github.workspace }}/stage" \
            -DTEST_ROOT="${{ github.workspace }}/build/package-example-incremental" \
            -P tests/package_example/RunIncrementalBuildTest.cmake

      - name: Verify uninstall
        if: matrix.verify_installed_package
        run: |
          cmake \
            -DBUILD_DIR="${{ github.workspace }}/build" \
            -DINSTALL_PREFIX="${{ github.workspace }}/stage" \
            -P tests/cmake/VerifyUninstall.cmake

  installed-package-isolation:
    name: Installed package isolation (ubuntu-24.04 gcc)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare verified upstream archives
        run: |
          mkdir -p "${RUNNER_TEMP}/f2c-install-isolation-inputs"
          curl --fail --show-error --location --retry 3 \
            https://www.netlib.org/f2c/src.tgz \
            --output "${RUNNER_TEMP}/f2c-install-isolation-inputs/src.tgz"
          curl --fail --show-error --location --retry 3 \
            https://www.netlib.org/f2c/libf2c.zip \
            --output "${RUNNER_TEMP}/f2c-install-isolation-inputs/libf2c.zip"

      - name: Verify installed CMake package in isolation
        run: |
          cmake \
            -DSOURCE_ROOT="${GITHUB_WORKSPACE}" \
            -DTEST_ROOT="${RUNNER_TEMP}/f2c-install-isolation" \
            -DSRC_ARCHIVE="${RUNNER_TEMP}/f2c-install-isolation-inputs/src.tgz" \
            -DLIBF2C_ARCHIVE="${RUNNER_TEMP}/f2c-install-isolation-inputs/libf2c.zip" \
            -DC_COMPILER="$(command -v gcc)" \
            -P tests/install_isolation/RunInstallIsolationTest.cmake

  offline-build-and-test:
    name: Offline build and test (ubuntu-24.04 gcc)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare offline archives
        run: |
          mkdir -p archives
          curl --fail --show-error --location --retry 3 \
            https://www.netlib.org/f2c/src.tgz \
            --output archives/src.tgz
          curl --fail --show-error --location --retry 3 \
            https://www.netlib.org/f2c/libf2c.zip \
            --output archives/libf2c.zip

      - name: Configure
        run: >
          cmake -S . -B build
          -DNET_FETCH=OFF
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/stage"

      - name: Verify installed manual page
        run: |
          cmake \
            -DINSTALL_PREFIX="${{ github.workspace }}/stage" \
            -DINSTALL_MANIFEST="${{ github.workspace }}/build/install_manifest.txt" \
            -P tests/cmake/VerifyInstalledManual.cmake

      - name: Verify installed package with CMake example
        run: |
          cmake -S examples/cmake -B build/package-example \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage"
          cmake --build build/package-example --parallel
          ctest --test-dir build/package-example --output-on-failure

      - name: Verify installed pkg-config package
        run: |
          cmake \
            -DINSTALL_PREFIX="${{ github.workspace }}/stage" \
            -DINSTALL_MANIFEST="${{ github.workspace }}/build/install_manifest.txt" \
            -DPACKAGE_EXPECTATIONS="${{ github.workspace }}/build/tests/pkg_config/PackageExpectations.cmake" \
            -DSOURCE_FILE="${{ github.workspace }}/tests/cases/pipeline/smoke/01_hello/hello.f" \
            -DEXPECTED_STDOUT_FILE="${{ github.workspace }}/tests/cases/pipeline/smoke/01_hello/expected.txt" \
            -DC_COMPILER="${CC}" \
            -DSOURCE_ROOT="${{ github.workspace }}" \
            -DBUILD_ROOT="${{ github.workspace }}/build" \
            -DTEST_ROOT="${{ github.workspace }}/build/pkg-config-consumer" \
            -DREQUIRE_PKG_CONFIG=ON \
            -P tests/pkg_config/VerifyInstalledPkgConfig.cmake

      - name: Verify Fortran changes trigger regeneration
        run: |
          cmake \
            -DEXAMPLE_SOURCE_DIR="${{ github.workspace }}/examples/cmake" \
            -DF2C_PREFIX="${{ github.workspace }}/stage" \
            -DTEST_ROOT="${{ github.workspace }}/build/package-example-incremental" \
            -P tests/package_example/RunIncrementalBuildTest.cmake

      - name: Verify uninstall
        run: |
          cmake \
            -DBUILD_DIR="${{ github.workspace }}/build" \
            -DINSTALL_PREFIX="${{ github.workspace }}/stage" \
            -P tests/cmake/VerifyUninstall.cmake
