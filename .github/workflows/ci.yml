name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04 gcc
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            cmake_version: ""
            enable_sanitizers: OFF
            lsan_options: ""
          - name: ubuntu-24.04 clang+sanitizers
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cmake_version: ""
            enable_sanitizers: ON
            lsan_options: detect_leaks=0
          - name: ubuntu-22.04 gcc
            os: ubuntu-22.04
            cc: gcc
            cxx: g++
            cmake_version: "3.20.6"
            enable_sanitizers: OFF
            lsan_options: ""
          - name: macos-15 apple-clang
            os: macos-15
            cc: clang
            cxx: clang++
            cmake_version: ""
            enable_sanitizers: OFF
            lsan_options: ""
          - name: macos-14 apple-clang
            os: macos-14
            cc: clang
            cxx: clang++
            cmake_version: ""
            enable_sanitizers: OFF
            lsan_options: ""

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LSAN_OPTIONS: ${{ matrix.lsan_options }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up minimum supported CMake
        if: matrix.cmake_version != ''
        env:
          CMAKE_VERSION: ${{ matrix.cmake_version }}
          CMAKE_SHA256: 458777097903b0f35a0452266b923f0a2f5b62fe331e636e2dcc4b636b768e36
        run: |
          archive="${RUNNER_TEMP}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          install_dir="${RUNNER_TEMP}/cmake-${CMAKE_VERSION}-linux-x86_64"
          curl --fail --show-error --location --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" \
            --output "${archive}"
          echo "${CMAKE_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      - name: Show CMake version
        run: cmake --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DNET_FETCH=ON
          -DBUILD_TESTING=ON
          -DENABLE_SANITIZERS=${{ matrix.enable_sanitizers }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/stage"

      - name: Verify installed package with find_package
        run: |
          cmake -S tests/package_smoke -B build/package_smoke \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage"
          cmake --build build/package_smoke --parallel

  offline-build-and-test:
    name: Offline build and test (ubuntu-24.04 gcc)
    runs-on: ubuntu-24.04

    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare offline archives
        run: |
          mkdir -p archives
          curl -L https://www.netlib.org/f2c/src.tgz -o archives/src.tgz
          curl -L https://www.netlib.org/f2c/libf2c.zip -o archives/libf2c.zip

      - name: Configure
        run: >
          cmake -S . -B build
          -DNET_FETCH=OFF
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/stage"

      - name: Verify installed package with find_package
        run: |
          cmake -S tests/package_smoke -B build/package_smoke \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage"
          cmake --build build/package_smoke --parallel
